<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
<defs>
  <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#02101f"/><stop offset="1" stop-color="#010714"/>
  </linearGradient>
  <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
    <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.5"/>
  </radialGradient>
  <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#000" opacity="0.28"/>
  </pattern>
  <clipPath id="w1"><rect x="160" y="109" width="0" height="18">
    <animate attributeName="width" from="0" to="153" dur="0.78s" begin="3.95s" fill="freeze"/></rect></clipPath>
  <clipPath id="w2"><rect x="160" y="139" width="0" height="18">
    <animate attributeName="width" from="0" to="270" dur="1.5s" begin="4.75s" fill="freeze"/></rect></clipPath>
  <clipPath id="w3"><rect x="160" y="173" width="0" height="18">
    <animate attributeName="width" from="0" to="198" dur="1s" begin="5.55s" fill="freeze"/></rect></clipPath>
  <clipPath id="w4"><rect x="160" y="207" width="0" height="18">
    <animate attributeName="width" from="0" to="333" dur="1.85s" begin="6.55s" fill="freeze"/></rect></clipPath>
  <style>
    .boot  {{ font: 15px "Courier New", monospace; fill: #22d3ee; }}
    .booth {{ font: bold 15px "Courier New", monospace; fill: #00e5ff; }}
    .dim   {{ font: 13px "Courier New", monospace; fill: #0e7490; }}
    .task  {{ font: bold 12px "Courier New", monospace; fill: #00e5ff; }}
    .task2 {{ font: 15px "Courier New", monospace; fill: #22d3ee; }}
    .ttl   {{ font: bold 12px "Courier New", monospace; fill: #00e5ff; }}
    .prm   {{ font: 15px "Courier New", monospace; fill: #4ade80; }}
    .out   {{ font: 15px "Courier New", monospace; fill: #00e5ff; }}
  </style>
</defs>

<rect width="800" height="450" fill="#010409"/>

<!-- ============ BOOT SCENE ============ -->
<g>
  <text x="70" y="78" class="booth" visibility="hidden">ZAION BIOS v2.11 // CRT-9000
    <set attributeName="visibility" to="visible" begin="0.3s"/></text>
  <text x="70" y="112" class="boot" visibility="hidden">CPU : ZAION-486DX @ 99 MHZ ........... OK
    <set attributeName="visibility" to="visible" begin="0.7s"/></text>
  <text x="70" y="146" class="boot" visibility="hidden">RAM : 640K BASE / 16384K EXT ......... OK
    <set attributeName="visibility" to="visible" begin="1.1s"/></text>
  <text x="70" y="180" class="boot" visibility="hidden">CRT : PHOSPHOR P1 CYAN ............... OK
    <set attributeName="visibility" to="visible" begin="1.5s"/></text>
  <text x="70" y="214" class="boot" visibility="hidden">LOADING ZAION_OS.SYS ...
    <set attributeName="visibility" to="visible" begin="1.9s"/></text>
  <text x="70" y="248" class="boot" visibility="hidden">SHELL : MS-TERMINAL 95 ................. OK
    <set attributeName="visibility" to="visible" begin="2.4s"/></text>
  <text x="70" y="282" class="booth" visibility="hidden">BOOT COMPLETE - WELCOME, BEN
    <set attributeName="visibility" to="visible" begin="2.8s"/></text>
  <text x="70" y="380" class="dim" visibility="hidden">PRESS ANY KEY ... OR JUST WATCH
    <set attributeName="visibility" to="visible" begin="2s"/></text>
  <rect x="72" y="288" width="16" height="14" fill="#00e5ff">
    <animate attributeName="opacity" values="1;0;1" dur="0.4s" repeatCount="indefinite" begin="0.4s"/>
    <set attributeName="visibility" to="hidden" begin="2.9s"/>
  </rect>
</g>

<!-- ============ DESKTOP SCENE ============ -->
<g visibility="hidden">
  <set attributeName="visibility" to="visible" begin="3.05s"/>
  <rect width="800" height="416" fill="url(#desk)"/>
  <rect x="0" y="416" width="800" height="34" fill="#03132d" stroke="#0e7490"/>
  <rect x="6" y="420" width="86" height="22" fill="#082f49" stroke="#00e5ff"/>
  <text x="14" y="436" class="task">ZAION</text>
  <text x="100" y="437" class="task2">| MS-TERMINAL 95</text>
  <text x="730" y="437" class="task2">18:43</text>
  <circle cx="712" cy="430" r="4" fill="#4ade80">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.2s" repeatCount="indefinite" begin="3.05s"/>
  </circle>

  <!-- window opening -->
  <rect x="140" y="70" width="70" height="40" fill="#04122b" stroke="#0e7490" stroke-width="2">
    <animate attributeName="width" from="70" to="590" dur="0.55s" begin="3.1s" fill="freeze" calcMode="spline" keySplines="0.33 1" keyTimes="0;1" values="70;590"/>
    <animate attributeName="height" from="40" to="290" dur="0.55s" begin="3.1s" fill="freeze" calcMode="spline" keySplines="0.33 1" keyTimes="0;1" values="40;290"/>
  </rect>

  <g visibility="hidden">
    <set attributeName="visibility" to="visible" begin="3.65s"/>
    <rect x="140" y="70" width="590" height="26" fill="#082f49"/>
    <text x="150" y="88" class="ttl">C:\ZAION\BEN - TERMINAL</text>
    <rect x="706" y="75" width="14" height="14" fill="none" stroke="#f87171"/>

    <text x="160" y="122" class="prm" clip-path="url(#w1)">C:\ZAION&gt; whoami</text>
    <text x="160" y="152" class="out" clip-path="url(#w2)">ben_zaion :: SOFTWARE DEVELOPER</text>
    <text x="160" y="186" class="prm" clip-path="url(#w3)">C:\ZAION&gt; run doom.exe</text>
    <text x="160" y="216" class="out" clip-path="url(#w4)">ERROR 404: FUN NOT FOUND - BACK TO WORK</text>
    <text x="160" y="336" class="dim">CRT-9000 // 1995</text>

    <!-- typing cursors -->
    <g fill="#4ade80">
      <rect x="308" y="108" width="9" height="15" visibility="hidden"><set attributeName="visibility" to="visible" begin="3.95s"/><set attributeName="visibility" to="hidden" begin="4.73s"/><animate attributeName="opacity" values="1;0;1" dur="0.25s" repeatCount="indefinite" begin="3.95s"/></rect>
    </g>
    <g fill="#00e5ff">
      <rect x="425" y="138" width="9" height="15" visibility="hidden"><set attributeName="visibility" to="visible" begin="4.75s"/><set attributeName="visibility" to="hidden" begin="6.25s"/><animate attributeName="opacity" values="1;0;1" dur="0.25s" repeatCount="indefinite" begin="4.75s"/></rect>
      <rect x="353" y="172" width="9" height="15" visibility="hidden"><set attributeName="visibility" to="visible" begin="5.55s"/><set attributeName="visibility" to="hidden" begin="6.55s"/><animate attributeName="opacity" values="1;0;1" dur="0.25s" repeatCount="indefinite" begin="5.55s"/></rect>
      <rect x="488" y="206" width="9" height="15" visibility="hidden"><set attributeName="visibility" to="visible" begin="6.55s"/><set attributeName="visibility" to="hidden" begin="8.4s"/><animate attributeName="opacity" values="1;0;1" dur="0.25s" repeatCount="indefinite" begin="6.55s"/></rect>
    </g>

    <!-- idle cursor -->
    <rect x="160" y="242" width="9" height="15" fill="#00e5ff" visibility="hidden">
      <set attributeName="visibility" to="visible" begin="8.05s"/>
      <animate attributeName="opacity" values="1;0;1" dur="0.5s" repeatCount="indefinite" begin="8.05s"/>
    </rect>
  </g>
</g>

<!-- ============ CRT OVERLAYS ============ -->
<g>
  <animateTransform attributeName="transform" type="translate" from="0 -50" to="0 500" dur="4.58s" repeatCount="indefinite"/>
  <rect x="0" y="0" width="800" height="5" fill="#b4ffff" opacity="0.1"/>
  <rect x="0" y="5" width="800" height="13" fill="#00e5ff" opacity="0.04"/>
</g>
<rect width="800" height="450" fill="#00e5ff" opacity="0.02">
  <animate attributeName="opacity" values="0.02;0.014;0.02;0.017;0.02" dur="0.35s" repeatCount="indefinite"/>
</rect>
<rect width="800" height="450" fill="url(#scan)"/>
<rect width="800" height="450" fill="url(#vig)"/>
</svg>