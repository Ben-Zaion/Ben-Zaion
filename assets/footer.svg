<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800">
<defs>
  <filter id="glow3" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan4" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity="0.5"/></pattern>
  <style>
    .f { font: bold 16px "Courier New", monospace; fill: #00e5ff; filter: url(#glow3); letter-spacing: 2px; }
    .s { font: 11px "Courier New", monospace; fill: #0e7490; }
  </style>
</defs>
<rect width="800" height="120" fill="#010409"/>
<line x1="60" y1="36" x2="740" y2="36" stroke="#0e7490" stroke-width="1"/>
<text x="400" y="66" text-anchor="middle" class="f">:: END OF TRANSMISSION ::</text>
<text x="400" y="92" text-anchor="middle" class="s">ben_zaion // est. 1995 // signal over noise
  <animate attributeName="opacity" values="1;.4;1" dur="2.4s" repeatCount="indefinite"/>
</text>
<line x1="60" y1="104" x2="740" y2="104" stroke="#0e7490" stroke-width="1"/>
<rect width="800" height="120" fill="url(#scan4)" pointer-events="none"/>
</svg>